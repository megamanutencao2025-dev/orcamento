{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <script>
        (() => {
            const saved = localStorage.getItem("pricewise-theme");
            const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
        })();
    </script>
    <title>Senha alterada | Gestor Elétrico</title>
    <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
    <link rel="stylesheet" href="{% static 'css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <header class="auth-topbar">
            <a class="auth-brand" href="{% url 'core:dashboard' %}" aria-label="Voltar ao Gestor Elétrico">
                <span class="auth-brand__mark" aria-hidden="true">⚡</span>
                <span>
                    <strong>Gestor</strong>
                    <small>Elétrico</small>
                </span>
            </a>
            <button class="icon-button" id="theme-toggle" type="button" aria-label="Alternar tema" aria-pressed="false">◐</button>
        </header>

        <main class="auth-main">
            <section class="auth-card auth-card--success" aria-labelledby="password-changed-title">
                <span class="auth-success-icon" aria-hidden="true">✓</span>
                <div class="auth-card__heading">
                    <span class="auth-eyebrow">Alteração concluída</span>
                    <h1 id="password-changed-title">Senha alterada com sucesso</h1>
                    <p>Sua nova senha já está ativa e deverá ser usada nos próximos acessos.</p>
                </div>
                <a class="button button--primary button--block auth-submit" href="{% url 'core:dashboard' %}">Voltar ao sistema</a>
            </section>
        </main>
    </div>
    <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
